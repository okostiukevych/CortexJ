# CodeQL is SKIPPED for now (issue: the repository is private and
# "Code scanning" is not enabled in the repository settings - requires
# GitHub Advanced Security - so every real run failed at the SARIF upload
# stage with "Code scanning is not enabled for this repository").
# The job below never executes (if: false) - it shows as skipped on every
# run, never red. Re-enable by removing the `if: false` line after enabling
# code scanning in Settings -> Code security -> Code scanning.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (java)
    if: false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended
      - name: Build for analysis
        run: mvn -B clean install -DskipTests
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
