# Full verification matrix: five LTS lines on Linux and macOS, Windows smoke
# lanes, JPMS descriptors, static analysis + coverage, and CPU runtime probes.
# GPU lanes stay opt-in on self-hosted runners (GPU_RUNNERS_ENABLED).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Hosted runners occasionally see connection resets from Maven Central;
  # retry transient transport failures instead of failing the lane.
  MAVEN_ARGS: -Dmaven.wagon.http.retryHandler.count=3 -Daether.connector.http.retryHandler.count=3

jobs:
  build:
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: '8' }
          - { os: ubuntu-latest, java: '11' }
          - { os: ubuntu-latest, java: '17' }
          - { os: ubuntu-latest, java: '21' }
          - { os: ubuntu-latest, java: '25' }
          - { os: macos-latest, java: '8', distribution: zulu }
          - { os: macos-latest, java: '11' }
          - { os: macos-latest, java: '17' }
          - { os: macos-latest, java: '21' }
          - { os: macos-latest, java: '25' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build and test (shared core + JDK-profile modules)
        run: mvn -B clean install

  windows:
    name: JDK ${{ matrix.java }} on windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: windows-maven-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            windows-maven-
      - name: Build and test
        run: mvn -B clean install

  jpms:
    name: JPMS module descriptors (JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: jpms-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-latest-maven-
      - name: Build with module-info
        run: mvn -B clean install -Pjpms

  # Quality lane: SpotBugs (documented triage in spotbugs-exclude.xml;
  # findings outside it fail the build) and a JaCoCo coverage report
  # published as a CI artifact. Runs on JDK 21 for a stable toolchain.
  quality:
    name: Static analysis + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: quality-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-latest-maven-
      - name: SpotBugs (fail on triaged-findings outside spotbugs-exclude.xml)
        run: mvn -B clean install -DskipTests -Pspotbugs
      - name: Tests with JaCoCo coverage
        run: mvn -B test -Pcoverage
      - name: Publish coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: |
            **/target/site/jacoco/
          retention-days: 14

  # GPU test infrastructure is SEPARATE from ordinary CI.
  # CUDA and Metal lanes require self-hosted runners with the corresponding
  # accelerators; the lanes below are explicitly CPU-only and never silently
  # skip compatibility assertions - provider probes report honestly on any lane.
  cpu-verification:
    name: CPU-only runtime verification
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: cpu-verify-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            macos-latest-maven-
      - name: CLI doctor (probes report honestly on CI machines, failures fail the build)
        run: |
          mvn -B clean install -DskipTests
          java -jar cli/target/cortexj-cli-*.jar doctor

  # GPU test infrastructure is SEPARATE from ordinary CI. The lanes below
  # activate only on self-hosted runners labeled cuda/metal (opt-in via the
  # GPU_RUNNERS_ENABLED repository variable) - they never run on hosted runners and
  # never silently skip compatibility assertions. Profiles:
  #   NVIDIA CUDA -> runners labeled "cuda" (ubuntu + NVIDIA driver)
  #   Apple Metal -> runners labeled "metal" (macos + Apple Silicon)
  #   CPU-only    -> the dedicated cpu-verification lane above
  gpu-cuda:
    name: GPU CUDA lane (self-hosted)
    if: ${{ vars.GPU_RUNNERS_ENABLED == 'true' }}
    runs-on: [self-hosted, cuda]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test (GPU runtimes probed honestly on the accelerator)
        run: mvn -B clean install

  gpu-metal:
    name: GPU Metal lane (self-hosted)
    if: ${{ vars.GPU_RUNNERS_ENABLED == 'true' }}
    runs-on: [self-hosted, metal]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test (GPU runtimes probed honestly on the accelerator)
        run: mvn -B clean install

  # Binary compatibility gate (spec §74): after the 1.0.0 release the baseline
  # lives in the cortexj-maven repository (declared in the parent POM). This job
  # fails the build on any binary-incompatible change to the Public API /
  # Stable SPI tiers without a major bump.
  compat:
    name: Binary compatibility (japicmp vs the latest release (1.0.1))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ubuntu-latest-maven-compat-${{ hashFiles('**/pom.xml') }}
      - name: japicmp against the 1.0.0 baseline
        run: mvn -B verify -Pcompat -Dcortexj.api.baseline=1.0.1 -Dcortexj.compat.skip=false -DskipTests

  # Supply-chain lane (spec §100/§99): every build produces CycloneDX SBOMs
  # for all modules (collected as an artifact) and a dependency hygiene report
  # (dependency:analyze). The SBOM attaches with classifier "cyclonedx" when
  # packaged under -Prelease - the gate flips to hard-fail once the first
  # release publishes with it (tracked in the runtime-hardening epic).
  supply-chain:
    name: Supply chain (SBOM + dependency hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ubuntu-latest-maven-sbom-${{ hashFiles('**/pom.xml') }}
      - name: Generate SBOMs (CycloneDX)
        run: mvn -B clean install -DskipTests -Psbom
      - name: Collect SBOMs
        run: |
          mkdir -p sbom-artifacts
          find . -path '*/target/bom.json' | while read -r f; do
            cp "$f" "sbom-artifacts/$(echo "$f" | sed 's#^\./##; s#/#_#g')"
          done
          ls sbom-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: sbom-artifacts
      - name: Dependency hygiene report (findings triage, not a gate yet)
        run: mvn -B dependency:analyze -DskipTests > dependency-analyze.log 2>&1 || true
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-hygiene-report
          path: dependency-analyze.log
