# All CI jobs are GATED for now (if: false) - they show as skipped on every
# run, never execute, never burn Actions minutes. Re-enable by removing the
# `if: false` line from each job when a verification pass is needed (see
# issues #53, #56, #91). CodeQL stays gated in codeql.yml: the repository is
# private without GitHub Advanced Security, so the SARIF upload would fail.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: false
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: '8' }
          - { os: ubuntu-latest, java: '11' }
          - { os: ubuntu-latest, java: '17' }
          - { os: ubuntu-latest, java: '21' }
          - { os: ubuntu-latest, java: '25' }
          - { os: macos-latest, java: '8', distribution: zulu }
          - { os: macos-latest, java: '11' }
          - { os: macos-latest, java: '17' }
          - { os: macos-latest, java: '21' }
          - { os: macos-latest, java: '25' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build and test (shared core + JDK-profile modules)
        run: mvn -B clean install

  windows:
    if: false
    name: JDK ${{ matrix.java }} on windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: windows-maven-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            windows-maven-
      - name: Build and test
        run: mvn -B clean install

  jpms:
    if: false
    name: JPMS module descriptors (JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: jpms-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-latest-maven-
      - name: Build with module-info (spec 95)
        run: mvn -B clean install -Pjpms

  # Issue #53: quality lane - SpotBugs static analysis (triage in
  # spotbugs-exclude.xml, findings outside it fail the build) and JaCoCo
  # coverage report published as a CI artifact. Runs on JDK 21 (SpotBugs
  # 4.9.8.5 also reads JDK 25 class files, but 21 keeps the lane stable).
  quality:
    if: false
    name: Static analysis + coverage (issue #53)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: quality-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-latest-maven-
      - name: SpotBugs (fail on triaged-findings outside spotbugs-exclude.xml)
        run: mvn -B clean install -DskipTests -Pspotbugs
      - name: Tests with JaCoCo coverage
        run: mvn -B test -Pcoverage
      - name: Publish coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: |
            **/target/site/jacoco/
          retention-days: 14

  # Spec 70: GPU test infrastructure is SEPARATE from ordinary CI.
  # CUDA and Metal lanes require self-hosted runners with the corresponding
  # accelerators; the lanes below are explicitly CPU-only and never silently
  # skip compatibility assertions - provider probes report honestly on any lane.
  cpu-verification:
    if: false
    name: CPU-only runtime verification (spec 70)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: cpu-verify-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            macos-latest-maven-
      - name: CLI doctor (probes report honestly on CI machines, failures fail the build)
        run: |
          mvn -B clean install -DskipTests
          java -jar cli/target/cortexj-cli-0.1.0-SNAPSHOT.jar doctor

  # Spec 70: GPU test infrastructure is SEPARATE from ordinary CI. The lanes below
  # activate only on self-hosted runners labeled cuda/metal (opt-in via the
  # GPU_RUNNERS_ENABLED repository variable) - they never run on hosted runners and
  # never silently skip compatibility assertions. Profiles per spec 70:
  #   NVIDIA CUDA -> runners labeled "cuda" (ubuntu + NVIDIA driver)
  #   Apple Metal -> runners labeled "metal" (macos + Apple Silicon)
  #   CPU-only    -> the dedicated cpu-verification lane above
  gpu-cuda:
    name: GPU CUDA lane (spec 70, self-hosted)
    if: ${{ vars.GPU_RUNNERS_ENABLED == 'true' }}
    runs-on: [self-hosted, cuda]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test (GPU runtimes probed honestly on the accelerator)
        run: mvn -B clean install

  gpu-metal:
    name: GPU Metal lane (spec 70, self-hosted)
    if: ${{ vars.GPU_RUNNERS_ENABLED == 'true' }}
    runs-on: [self-hosted, metal]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test (GPU runtimes probed honestly on the accelerator)
        run: mvn -B clean install
